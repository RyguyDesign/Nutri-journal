<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nutri-journal</title>
  <meta name="description" content="Personal nutrition journal and calorie tracker">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141513" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nutri-journal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="main" class="main" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  <noscript>This app needs JavaScript.</noscript>
  <script>
    // Safety net: if the app hasn't started after a few seconds, show why and
    // offer a reload that clears cached app files. Journal data is not touched.
    (function () {
      var errors = [];
      window.addEventListener('error', function (e) {
        errors.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        errors.push(String(e.reason && e.reason.message || e.reason));
      });
      function reload() {
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }
      setTimeout(function () {
        if (window.__appStarted) return;
        var main = document.getElementById('main');
        main.innerHTML = '';
        var box = document.createElement('div');
        box.className = 'card error';
        box.style.cssText = 'margin:24px 0;padding:16px;border:1px solid #b42318;border-radius:14px;font:16px/1.45 system-ui,sans-serif';
        var p = document.createElement('p');
        p.textContent = 'The app didn’t load. If it is open in another tab, close that tab first. Then tap Reload. Your journal is not affected.';
        var btn = document.createElement('button');
        btn.textContent = 'Reload';
        btn.style.cssText = 'min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#2f6b4f;color:#fff;font:inherit;font-weight:600';
        btn.onclick = reload;
        var detail = document.createElement('p');
        detail.style.cssText = 'color:#6b6d68;font-size:13px;margin-top:12px;word-break:break-word';
        detail.textContent = errors.length ? 'Details: ' + errors.join(' | ') : (('noModule' in document.createElement('script')) ? 'No error was reported.' : 'This browser is too old for the app. Open it in an up-to-date Chrome.');
        box.append(p, btn, detail);
        main.append(box);
      }, 6000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
